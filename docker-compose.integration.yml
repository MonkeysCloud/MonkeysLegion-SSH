services:
  ssh-test-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: monkeyslegion-ssh-test-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=integration
      - USER_PASSWORD=integration-password
      - SUDO_ACCESS=false
    ports:
      - "2222:2222"
    restart: unless-stopped
